[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-pentester-backend"
version = "0.1.0"
description = "AI-powered source-code security auditing tool (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
git = ["GitPython>=3.1"]
scan = ["semgrep>=1.80"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["aipentester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
